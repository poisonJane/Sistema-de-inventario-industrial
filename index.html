<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Inventario Industrial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">⚙️</div>
      <h1>Inventario Industrial</h1>
      <p>Sistema de control de refacciones</p>
    </div>

    <form id="loginForm">
      <label>Usuario</label>
      <input type="text" id="usuario" placeholder="admin / gerente / tecnico1" required>

      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••" required>

      <button type="submit" class="btn-primary">Ingresar</button>
      <p id="loginError" class="error-msg"></p>
    </form>

    <div class="login-hint">
      <strong>Usuarios demo:</strong><br>
      admin / 1234 · gerente / 1234 · tecnico1 / 1234
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
